<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jujutsu 8-Bit RPG - Domain Chronicles</title>
    <style>
        body {
            background-color: #08080c;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            color: #c084fc;
            margin: 0 0 10px 0;
            text-shadow: 2px 2px #000, 0 0 10px #7e22ce;
            font-size: 22px;
            letter-spacing: 2px;
        }
        canvas {
            border: 4px solid #7e22ce;
            box-shadow: 0 0 25px rgba(126, 34, 206, 0.5);
            background-color: #030305;
            image-rendering: pixelated;
        }
        .instructions {
            margin-top: 8px;
            color: #94a3b8;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <h1>JUJUTSU 8-BIT: O DESPERTAR DAS MÁSCARAS</h1>
    <canvas id="gameCanvas" width="640" height="400"></canvas>
    <div class="instructions">Clique nos botões ou na caixa de texto para avançar</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- DADOS DOS CLÃS E HABILIDADES ---
const CLANS = {
    GOJO: {
        name: "Clã Gojo",
        skillName: "Lapse Blue / Reversal Red",
        domainName: "Vazio Imensurável",
        hp: 130, energy: 100, atk: 28,
        passive: "Seis Olhos (Regeneração de Energia)"
    },
    ZENIN: {
        name: "Clã Zen'in",
        skillName: "Invocação de Sombra",
        domainName: "Jardim das Sombras",
        hp: 150, energy: 70, atk: 24,
        passive: "Dez Sombras (Velocidade & Crítico)"
    },
    KAMO: {
        name: "Clã Kamo",
        skillName: "Perfuração de Sangue",
        domainName: "Escarlate Absoluto",
        hp: 170, energy: 60, atk: 22,
        passive: "Manipulação Sangrenta (Alta Vida)"
    },
    INUMAKI: {
        name: "Clã Inumaki",
        skillName: "Fala Amaldiçoada: PARE!",
        domainName: "Ressoador Supremo",
        hp: 120, energy: 80, atk: 30,
        passive: "Comando Místico (Dano Massivo)"
    }
};

// --- CUTSCENES E HISTÓRIA ---
const CUTSCENES = {
    INTRO: [
        { speaker: "Satoru Gojo", avatar: "GOJO", text: "Uma aura de energia amaldiçoada milenar acabou de surgir na cidade..." },
        { speaker: "Feiticeiro", avatar: "PLAYER", text: "As barreira da escola Jujutsu estão cedendo! Quem está por trás disso?" },
        { speaker: "Satoru Gojo", avatar: "GOJO", text: "Não se preocupe. Não importa quão forte seja o inimigo... Afinal, nós somos os mais fortes." }
    ],
    CHAPTER1_PRE: [
        { speaker: "Espírito Amaldiçoado", avatar: "CURSE1", text: "Gaaaaah! Carne de feiticeiro... Vou devorar seu domínio!" },
        { speaker: "Feiticeiro", avatar: "PLAYER", text: "Hora de testar as táticas do meu clã. Em guarda!" }
    ],
    CHAPTER2_PRE: [
        { speaker: "Maldição de Nível Especial", avatar: "CURSE2", text: "Sinta o verdadeiro terror do mundo das sombras humano!" },
        { speaker: "Feiticeiro", avatar: "PLAYER", text: "Minhas moedas arcanas estão acumuladas. Se necessário, expandirei meu domínio!" }
    ]
};

// --- ESTADO DO JOGO ---
let gameState = 'SELECT_CLAN'; // SELECT_CLAN, CUTSCENE, HUB, BATTLE, SHOP, GAME_OVER
let currentChapter = 1;
let cutsceneQueue = [];
let cutsceneIndex = 0;
let nextStateAfterCutscene = 'HUB';
let activeOrbAnimation = null; // 'BLUE', 'RED', 'PURPLE'
let domainActive = false;

let player = {
    clanKey: null,
    clan: null,
    hp: 100, maxHp: 100,
    energy: 50, maxEnergy: 50,
    atk: 20,
    coins: 50,
    domainUnlocked: false,
    domainLevel: 0
};

let enemy = {
    name: "Maldição do Abismo",
    avatar: "CURSE1",
    hp: 100, maxHp: 100,
    atk: 15,
    rewardCoins: 60
};

let logMessage = "Escolha o seu clã para iniciar sua jornada.";

// --- INPUT DE MOUSE ---
canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    handleClick(x, y);
});

function handleClick(x, y) {
    if (gameState === 'SELECT_CLAN') {
        if (checkBtn(x, y, 50, 120, 250, 50)) selectClan('GOJO');
        if (checkBtn(x, y, 340, 120, 250, 50)) selectClan('ZENIN');
        if (checkBtn(x, y, 50, 200, 250, 50)) selectClan('KAMO');
        if (checkBtn(x, y, 340, 200, 250, 50)) selectClan('INUMAKI');
    } 
    else if (gameState === 'CUTSCENE') {
        advanceCutscene();
    }
    else if (gameState === 'HUB') {
        if (checkBtn(x, y, 220, 150, 200, 40)) prepareBattle();
        if (checkBtn(x, y, 220, 210, 200, 40)) gameState = 'SHOP';
        if (checkBtn(x, y, 220, 270, 200, 40)) rest();
    } 
    else if (gameState === 'SHOP') {
        if (checkBtn(x, y, 170, 220, 300, 40)) buyDomain();
        if (checkBtn(x, y, 220, 300, 200, 40)) gameState = 'HUB';
    } 
    else if (gameState === 'BATTLE') {
        if (checkBtn(x, y, 50, 320, 160, 40)) playerAttack();
        if (checkBtn(x, y, 240, 320, 160, 40)) playerSkill();
        if (checkBtn(x, y, 430, 320, 160, 40)) playerDomain();
    }
    else if (gameState === 'GAME_OVER') {
        if (checkBtn(x, y, 220, 250, 200, 40)) location.reload();
    }
}

function checkBtn(x, y, bx, by, bw, bh) {
    return x >= bx && x <= bx + bw && y >= by && y <= by + bh;
}

// --- LÓGICA DO JOGO & CUTSCENES ---
function selectClan(key) {
    player.clanKey = key;
    player.clan = CLANS[key];
    player.maxHp = player.clan.hp;
    player.hp = player.clan.hp;
    player.maxEnergy = player.clan.energy;
    player.energy = player.clan.energy;
    player.atk = player.clan.atk;
    
    startCutscene(CUTSCENES.INTRO, 'HUB');
}

function startCutscene(dialogues, nextState) {
    cutsceneQueue = dialogues;
    cutsceneIndex = 0;
    nextStateAfterCutscene = nextState;
    gameState = 'CUTSCENE';
}

function advanceCutscene() {
    cutsceneIndex++;
    if (cutsceneIndex >= cutsceneQueue.length) {
        gameState = nextStateAfterCutscene;
    }
}

function prepareBattle() {
    if (currentChapter === 1) {
        enemy.name = "Maldição de Nível 2";
        enemy.avatar = "CURSE1";
        enemy.maxHp = 110;
        enemy.hp = 110;
        enemy.atk = 14;
        enemy.rewardCoins = 70;
        startCutscene(CUTSCENES.CHAPTER1_PRE, 'BATTLE');
    } else {
        enemy.name = "Espírito de Nível Especial";
        enemy.avatar = "CURSE2";
        enemy.maxHp = 180 + (currentChapter * 20);
        enemy.hp = enemy.maxHp;
        enemy.atk = 20 + (currentChapter * 3);
        enemy.rewardCoins = 120;
        startCutscene(CUTSCENES.CHAPTER2_PRE, 'BATTLE');
    }
    domainActive = false;
}

function rest() {
    player.hp = player.maxHp;
    player.energy = player.maxEnergy;
    logMessage = "Sua energia mística e vida foram completamente restauradas!";
}

function playerAttack() {
    triggerOrbEffect('BLUE');
    let dmg = player.atk + Math.floor(Math.random() * 6);
    enemy.hp -= dmg;
    logMessage = `Você desfere um golpe envolvido em energia e causa ${dmg} de dano!`;
    
    if (enemy.hp <= 0) winBattle();
    else enemyTurn();
}

function playerSkill() {
    let cost = player.clanKey === 'GOJO' ? 15 : 25;
    if (player.energy < cost) {
        logMessage = "Energia mística insuficiente!";
        return;
    }
    player.energy -= cost;
    triggerOrbEffect(player.clanKey === 'GOJO' ? 'RED' : 'BLUE');
    
    let dmg = player.atk + 30;
    enemy.hp -= dmg;
    logMessage = `TÉCNICA DE CLÃ: ${player.clan.skillName}! Causou ${dmg} de dano!`;
    
    if (enemy.hp <= 0) winBattle();
    else enemyTurn();
}

function playerDomain() {
    if (!player.domainUnlocked) {
        logMessage = "Compre a Expansão de Domínio na Loja primeiro!";
        return;
    }
    if (player.energy < 40) {
        logMessage = "Energia insuficiente para expandir o domínio!";
        return;
    }
    player.energy -= 40;
    domainActive = true;
    triggerOrbEffect('PURPLE');
    
    let dmg = player.atk + 75 + (player.domainLevel * 25);
    enemy.hp -= dmg;
    logMessage = `EXPANSÃO DE DOMÍNIO: ${player.clan.domainName}! Golpe Inevitável: ${dmg} de dano!`;
    
    if (enemy.hp <= 0) winBattle();
    else enemyTurn();
}

function triggerOrbEffect(type) {
    activeOrbAnimation = type;
    setTimeout(() => { activeOrbAnimation = null; }, 800);
}

function enemyTurn() {
    setTimeout(() => {
        let dmg = enemy.atk + Math.floor(Math.random() * 6);
        if (domainActive) dmg = Math.floor(dmg * 0.5); // Domínio reduz dano recebido
        
        player.hp -= dmg;
        logMessage += ` A maldição reagiu causando ${dmg} de dano!`;
        
        if (player.hp <= 0) {
            gameState = 'GAME_OVER';
            logMessage = "Você sucumbiu à energia amaldiçoada...";
        }
    }, 500);
}

function winBattle() {
    player.coins += enemy.rewardCoins;
    currentChapter++;
    logMessage = `Vitória! Você purificou o inimigo e ganhou ${enemy.rewardCoins} Moedas!`;
    gameState = 'HUB';
}

function buyDomain() {
    let cost = player.domainUnlocked ? 180 : 100;
    if (player.coins >= cost) {
        player.coins -= cost;
        if (!player.domainUnlocked) {
            player.domainUnlocked = true;
            player.domainLevel = 1;
            logMessage = "Você dominou o ápice do feitiço: EXPANSÃO DE DOMÍNIO!";
        } else {
            player.domainLevel++;
            logMessage = `Seu Domínio evoluiu para o Nível ${player.domainLevel}!`;
        }
    } else {
        logMessage = "Moedas arcanas insuficientes!";
    }
}

// --- RENDERS EM PIXEL ART (INSPIRADO NA IMAGEM) ---

// Desenha o Gojo idêntico à imagem enviada
function drawGojoPixelSprite(x, y, scale = 2) {
    ctx.save();
    ctx.translate(x, y);

    // Sombra
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath();
    ctx.ellipse(12 * scale, 34 * scale, 10 * scale, 3 * scale, 0, 0, Math.PI * 2);
    ctx.fill();

    // Cabelo Espetado Platinado (Estilo Imagem)
    ctx.fillStyle = "#e2e0f4";
    const hairPixels = [
        [4,0],[6,0],[12,0],[14,0],[18,0],
        [3,1],[5,1],[7,1],[11,1],[13,1],[15,1],[17,1],[19,1],
        [2,2],[4,2],[6,2],[8,2],[10,2],[12,2],[14,2],[16,2],[18,2],[20,2],
        [2,3],[3,3],[5,3],[7,3],[9,3],[11,3],[13,3],[15,3],[17,3],[19,3],[20,3],
        [1,4],[2,4],[4,4],[6,4],[8,4],[10,4],[12,4],[14,4],[16,4],[18,4],[20,4],[21,4]
    ];
    hairPixels.forEach(([px, py]) => ctx.fillRect(px * scale, py * scale, scale, scale));

    // Venda dos Olhos / Óculos
    ctx.fillStyle = "#121218";
    ctx.fillRect(2 * scale, 5 * scale, 20 * scale, 4 * scale);

    // Rosto / Pele
    ctx.fillStyle = "#fce0d0";
    ctx.fillRect(4 * scale, 9 * scale, 16 * scale, 4 * scale);

    // Roupa / Sobretudo Alto
    ctx.fillStyle = "#1e1e28";
    ctx.fillRect(5 * scale, 13 * scale, 14 * scale, 12 * scale);
    ctx.fillStyle = "#2a2a38"; // Gola alta
    ctx.fillRect(7 * scale, 13 * scale, 10 * scale, 3 * scale);

    // Braços
    ctx.fillStyle = "#1a1a24";
    ctx.fillRect(3 * scale, 15 * scale, 3 * scale, 8 * scale);
    ctx.fillRect(18 * scale, 15 * scale, 3 * scale, 8 * scale);

    // Calças e Sapato
    ctx.fillStyle = "#121218";
    ctx.fillRect(7 * scale, 25 * scale, 4 * scale, 8 * scale);
    ctx.fillRect(13 * scale, 25 * scale, 4 * scale, 8 * scale);

    ctx.restore();
}

// Desenha as Orbes Energéticas com Símbolo '+' da imagem
function drawEnergyOrb(x, y, type) {
    ctx.save();
    ctx.translate(x, y);

    let mainColor, lightColor, darkColor;
    if (type === 'BLUE') {
        mainColor = "#38bdf8"; lightColor = "#bae6fd"; darkColor = "#0284c7";
    } else if (type === 'RED') {
        mainColor = "#fb7185"; lightColor = "#fecdd3"; darkColor = "#e11d48";
    } else { // PURPLE
        mainColor = "#c084fc"; lightColor = "#f0abfc"; darkColor = "#7e22ce";
    }

    // Raios Espirais Externos
    ctx.fillStyle = lightColor;
    const tendrils = [
        [-15,-5], [-10,-12], [5,-15], [12,-10], [15,5], [10,12], [-5,15], [-12,10]
    ];
    tendrils.forEach(([tx, ty]) => ctx.fillRect(tx, ty, 3, 3));

    // Aura Central
    ctx.fillStyle = mainColor;
    ctx.beginPath();
    ctx.arc(0, 0, 12, 0, Math.PI * 2);
    ctx.fill();

    // Símbolo de '+' no Centro (Exatamente como na imagem)
    ctx.fillStyle = darkColor;
    ctx.fillRect(-2, -6, 4, 12);
    ctx.fillRect(-6, -2, 12, 4);

    ctx.restore();
}

// Desenha os Monstros/Maldições 8-Bit
function drawCurseSprite(x, y, type) {
    ctx.save();
    ctx.translate(x, y);

    ctx.fillStyle = type === 'CURSE1' ? "#4c0519" : "#3b0764";
    ctx.fillRect(0, 0, 50, 60);

    // Olhos Vermelhos Aterrorizantes
    ctx.fillStyle = "#ef4444";
    ctx.fillRect(10, 15, 10, 10);
    ctx.fillRect(30, 15, 10, 10);
    ctx.fillStyle = "#fff";
    ctx.fillRect(12, 17, 4, 4);
    ctx.fillRect(32, 17, 4, 4);

    // Boca com Dentes 8-bit
    ctx.fillStyle = "#000";
    ctx.fillRect(10, 38, 30, 12);
    ctx.fillStyle = "#fff";
    ctx.fillRect(12, 38, 4, 4);
    ctx.fillRect(22, 38, 4, 4);
    ctx.fillRect(32, 38, 4, 4);

    ctx.restore();
}

// --- TELA DE DESENHO E LOOP PRINCIPAL ---
function drawButton(x, y, w, h, text, color = "#7e22ce") {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);
    
    ctx.fillStyle = "#ffffff";
    ctx.font = "13px 'Courier New'";
    ctx.textAlign = "center";
    ctx.fillText(text, x + w / 2, y + h / 2 + 4);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Se a Expansão de Domínio estiver ativa, muda o cenário para o Vazio Ilimitado!
    if (domainActive) {
        ctx.fillStyle = "#020617";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "rgba(192, 132, 252, 0.15)";
        ctx.fillRect(10, 10, canvas.width - 20, canvas.height - 20);
    }

    if (gameState === 'SELECT_CLAN') {
        ctx.fillStyle = "#c084fc";
        ctx.font = "18px 'Courier New'";
        ctx.textAlign = "center";
        ctx.fillText("ESCOLHA SEU CLÃ DE FEITICEIRO", 320, 50);

        drawGojoPixelSprite(295, 260, 2);

        drawButton(50, 100, 250, 50, "Clã Gojo (Seis Olhos)");
        drawButton(340, 100, 250, 50, "Clã Zen'in (Sombras)");
        drawButton(50, 170, 250, 50, "Clã Kamo (Sangue)");
        drawButton(340, 170, 250, 50, "Clã Inumaki (Fala)");

        ctx.fillStyle = "#94a3b8";
        ctx.font = "12px 'Courier New'";
        ctx.fillText(logMessage, 320, 360);
    }
    else if (gameState === 'CUTSCENE') {
        let dialogue = cutsceneQueue[cutsceneIndex];
        
        // Avatar em Pixel Art
        if (dialogue.avatar === 'GOJO') drawGojoPixelSprite(50, 100, 3);
        else if (dialogue.avatar === 'PLAYER') drawGojoPixelSprite(50, 100, 3);
        else drawCurseSprite(50, 100, "CURSE1");

        // Caixa de Diálogo estilo Visual Novel Retro
        ctx.fillStyle = "rgba(15, 23, 42, 0.95)";
        ctx.fillRect(30, 240, 580, 130);
        ctx.strokeStyle = "#c084fc";
        ctx.lineWidth = 3;
        ctx.strokeRect(30, 240, 580, 130);

        ctx.fillStyle = "#e2e8f0";
        ctx.font = "bold 15px 'Courier New'";
        ctx.textAlign = "left";
        ctx.fillText(dialogue.speaker, 50, 270);

        ctx.fillStyle = "#94a3b8";
        ctx.font = "13px 'Courier New'";
        ctx.fillText(dialogue.text, 50, 305);

        ctx.fillStyle = "#c084fc";
        ctx.font = "11px 'Courier New'";
        ctx.fillText("[ Clique na tela para avançar ]", 410, 355);
    }
    else if (gameState === 'HUB') {
        ctx.fillStyle = "#c084fc";
        ctx.font = "18px 'Courier New'";
        ctx.textAlign = "left";
        ctx.fillText(`Capítulo ${currentChapter}: ${player.clan.name}`, 30, 40);

        drawGojoPixelSprite(50, 80, 3);

        ctx.fillStyle = "#fff";
        ctx.font = "13px 'Courier New'";
        ctx.fillText(`HP: ${player.hp} / ${player.maxHp}`, 200, 90);
        ctx.fillText(`Energia: ${player.energy} / ${player.maxEnergy}`, 200, 115);
        ctx.fillText(`Moedas Arcanas: ${player.coins}`, 200, 140);
        ctx.fillText(`Domínio: ${player.domainUnlocked ? 'Nível ' + player.domainLevel : 'Bloqueado'}`, 200, 165);

        drawButton(220, 200, 200, 40, "Entrar em Batalha", "#16a34a");
        drawButton(220, 250, 200, 40, "Santuário de Domínio", "#ca8a04");
        drawButton(220, 300, 200, 40, "Descansar / Curar", "#2563eb");

        ctx.fillStyle = "#cbd5e1";
        ctx.textAlign = "center";
        ctx.fillText(logMessage, 320, 375);
    }
    else if (gameState === 'SHOP') {
        ctx.fillStyle = "#ca8a04";
        ctx.font = "20px 'Courier New'";
        ctx.textAlign = "center";
        ctx.fillText("SANTUÁRIO DA EXPANSÃO DE DOMÍNIO", 320, 50);

        // Visualização das Orbes na Loja
        drawEnergyOrb(200, 130, 'BLUE');
        drawEnergyOrb(320, 130, 'PURPLE');
        drawEnergyOrb(440, 130, 'RED');

        ctx.fillStyle = "#fff";
        ctx.font = "13px 'Courier New'";
        ctx.fillText(`Suas Moedas Arcanas: ${player.coins}`, 320, 180);

        drawButton(170, 220, 300, 40, player.domainUnlocked ? "Evoluir Domínio (180 Moedas)" : "Desbloquear Domínio (100 Moedas)", "#ca8a04");
        drawButton(220, 290, 200, 40, "Voltar ao Menu", "#475569");

        ctx.fillStyle = "#c084fc";
        ctx.fillText(logMessage, 320, 365);
    }
    else if (gameState === 'BATTLE') {
        // Desenha Gojo/Player
        drawGojoPixelSprite(70, 150, 3);
        ctx.fillStyle = "#fff";
        ctx.font = "12px 'Courier New'";
        ctx.textAlign = "center";
        ctx.fillText(`HP: ${player.hp}/${player.maxHp}`, 105, 250);

        // Animador de Orbes
        if (activeOrbAnimation) {
            drawEnergyOrb(260, 180, activeOrbAnimation);
        }

        // Desenha o Inimigo
        drawCurseSprite(480, 150, enemy.avatar);
        ctx.fillStyle = "#ef4444";
        ctx.fillText(enemy.name, 505, 230);
        ctx.fillText(`HP: ${enemy.hp}/${enemy.maxHp}`, 505, 250);

        // Botões de Ação
        drawButton(50, 320, 160, 40, "Ataque Físico");
        drawButton(240, 320, 160, 40, "Técnica de Clã", "#2563eb");
        drawButton(430, 320, 160, 40, "DOMÍNIO", player.domainUnlocked ? "#ca8a04" : "#334155");

        ctx.fillStyle = "#e2e8f0";
        ctx.font = "12px 'Courier New'";
        ctx.fillText(logMessage, 320, 40);
    }
    else if (gameState === 'GAME_OVER') {
        ctx.fillStyle = "#ef4444";
        ctx.font = "24px 'Courier New'";
        ctx.textAlign = "center";
        ctx.fillText("SUA ENERGIA SE ESGOTOU", 320, 150);

        drawButton(220, 230, 200, 40, "Reiniciar Jornada", "#ef4444");
    }

    requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
